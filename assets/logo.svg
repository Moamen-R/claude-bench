<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="120" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="520" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#121211" />
      <stop offset="100%" stop-color="#0B0B0A" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Card Background with Subtle Orange Border Glow -->
  <rect x="1" y="1" width="518" height="118" rx="16" fill="url(#bgGrad)" stroke="#383532" stroke-width="1.5" />

  <!-- Outlined Anvil + Terminal Prompt Icon -->
  <g transform="translate(26, 22)" stroke="#E0754A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <rect width="76" height="76" rx="14" fill="#161615" stroke="#2E2D2B" stroke-width="1.5" />
    <g transform="translate(10, 14) scale(0.35)">
      <path d="M 2 20 H 40 V 46 C 22 44 10 34 2 20 Z" />
      <path d="M 40 20 L 46 15 H 52 V 50 H 40 Z" />
      <path d="M 52 15 H 158 V 25 C 138 30 124 44 118 65" />
      <path d="M 52 50 C 66 54 68 74 56 84 L 42 94 V 104 H 66 L 76 98" />
      <path d="M 66 104 V 92 L 84 80" />
      <rect x="90" y="65" width="68" height="48" rx="6" fill="#161615" stroke="#E0754A" stroke-width="6" />
      <polyline points="106,80 118,89 106,98" fill="none" stroke-width="6" />
      <line x1="125" y1="99" x2="142" y2="99" stroke-width="6" />
    </g>
  </g>

  <!-- Glowing Wordmark -->
  <text x="122" y="62" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="34" font-weight="700" letter-spacing="-0.5" fill="#E87A4E" filter="url(#glow)">
    claude-bench
  </text>
  <text x="122" y="62" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="34" font-weight="700" letter-spacing="-0.5" fill="#EE8759">
    claude-bench
  </text>

  <!-- v1.0 Badge -->
  <g transform="translate(366, 30)">
    <rect width="34" height="19" rx="5" fill="#252422" stroke="#3E3C38" stroke-width="1" />
    <text x="17" y="13" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="600" fill="#B8B5B0">v1.2.0</text>
  </g>

  <!-- Subtitle & Pill Tags -->
  <text x="124" y="88" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="500" letter-spacing="1.2" fill="#8E8C87">
    DEVELOPER CLI TOOL
  </text>

  <g transform="translate(280, 74)">
    <rect width="82" height="20" rx="10" fill="#1C1B1A" stroke="#383633" stroke-width="1" />
    <text x="41" y="13.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#D0CECA">OPEN SOURCE</text>
  </g>

  <g transform="translate(370, 74)">
    <rect width="36" height="20" rx="10" fill="#1C1B1A" stroke="#383633" stroke-width="1" />
    <text x="18" y="13.5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" fill="#D0CECA">CLI</text>
  </g>
</svg>