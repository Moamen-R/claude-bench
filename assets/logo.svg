<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="120" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="520" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#141413" />
      <stop offset="100%" stop-color="#1F1E1D" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E88B6B" />
      <stop offset="100%" stop-color="#D97757" />
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect width="520" height="120" rx="16" fill="url(#bgGrad)" stroke="#2E2D2B" stroke-width="1.5" />

  <!-- Minimal Forge + Terminal Icon -->
  <g transform="translate(32, 24)">
    <!-- Icon Container -->
    <rect width="72" height="72" rx="14" fill="#1C1B1A" stroke="#383633" stroke-width="1.5" />

    <!-- Anvil Horn / Top Surface -->
    <path d="M16 28 H56 L50 38 H26 L16 28 Z" fill="url(#accentGrad)" />

    <!-- Anvil Core & Base -->
    <path d="M28 40 H46 V48 L52 54 H22 L28 48 V40 Z" fill="#EDEDEC" />

    <!-- Spark / Prompt Cursor -->
    <path d="M48 14 L50 20 L56 22 L50 24 L48 30 L46 24 L40 22 L46 20 Z" fill="#D97757" />
  </g>

  <!-- Wordmark -->
  <text x="124" y="65" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="34" font-weight="700" letter-spacing="-0.5" fill="#F5F4F0">
    claude<tspan fill="#D97757">-forge</tspan>
  </text>

  <!-- Subtitle Tagline -->
  <text x="126" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" letter-spacing="1.5" fill="#8E8C87">
    CLI &amp; DESKTOP BOOTSTRAPPER ENGINE
  </text>
</svg>
